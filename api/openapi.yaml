                    - team_read
                  unique_id: ddf61a4d-6489-4665-bee6-7e21205f9d6f
                - description: Role 1 Description
                  name: Role 2
                  permissions:
                    - member_read
                    - sla_read
                    - team_read
                  unique_id: 97208d3e-e45d-409a-b951-4eae928a59b9
                - description: ew4rtyg
                  name: w4e5rty
                  permissions:
                    - escalation_policy_read
                    - incident_read
                    - incident_role_read
                    - member_read
                    - priority_read
                    - schedule_read
                    - service_read
                    - sla_read
                    - tag_read
                    - task_template_read
                    - team_read
                  unique_id: 0d087386-cebf-47ee-8dd3-c52f05c43128
              schema:
                $ref: '#/components/schemas/AccountCustomRole'
          description: OK
        "400":
          content:
            application/json:
              example:
                detail: This request can not be processed.
            application/xml:
              example:
                detail: This request can not be processed.
          description: Bad Request
        "403":
          content:
            application/json:
              example:
                detail: You do not have permission to perform this action.
            application/xml:
              example:
                detail: You do not have permission to perform this action.
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
          description: Not Found
