info:
  contact:
    email: vishwa@zenduty.com
  description: |
    # Introduction

    Zenduty is a cutting edge platform for incident management. With high level automation, Zenduty enables faster and better incident resolution keeping developers first.


      Javascript Libraries: https://github.com/Zenduty/zenduty-js

      Ruby Libraries: https://github.com/Zenduty/zenduty-ruby

      Python Libraries: https://github.com/Zenduty/zenduty-python-sdk

      Postman Collection for Zenduty API: https://github.com/Zenduty/zenduty-api-postman.git

      Account-level roles and permissions: https://docs.zenduty.com/docs/users#account-level-roles-and-permissions

      Team-level roles and permissions: https://docs.zenduty.com/docs/users#team-level-roles-and-permissions
  license:
    name: Apache 2.0
  termsOfService: https://zenduty.com
  title: Zenduty
  version: 1.1.0
  x-logo:
    url: data:image/svg+xml;base64,
openapi: 3.0.0
paths:
  /api/account/api_invite/:
    post:
      description: Returns an Account Member object.
      requestBody:
        content:
          application/json:
            example:
              team: db61f7ed-ba78-4536-9b2d-256b135a731d
              user_detail:
                email: michaelscott@zenduty.com
                first_name: Michael
                last_name: Scott
                role: 3
            schema:
              $ref: '#/components/schemas/InviteUserPayload'
          application/xml:
            example:
              team: db61f7ed-ba78-4536-9b2d-256b135a731d
              user_detail:
                email: michaelscott@zenduty.com
                first_name: Michael
                last_name: Scott
                role: 3
            schema:
              $ref: '#/components/schemas/InviteUserPayload'
        description: Request body parameters to create the Account Member object
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                joining_date: "2022-09-20T14:29:05.997454Z"
                role: 2
                team: db61f7ed-ba78-4536-9b2d-256b135a731d
                unique_id: e6931b6d-55d7-45e4-9f30-4dbf72bbcf06
                user:
                  email: michaelscott@zenduty.com
                  first_name: Michael
                  last_name: Scott
                  username: 39f4dedd-2754-4ee1-9c0c-1
              schema:
                $ref: '#/components/schemas/TeamMember'
            application/xml:
              example:
                joining_date: "2022-09-20T14:29:05.997454Z"
                role: 2
                team: db61f7ed-ba78-4536-9b2d-256b135a731d
                unique_id: e6931b6d-55d7-45e4-9f30-4dbf72bbcf06
                user:
                  email: michaelscott@zenduty.com
                  first_name: Michael
                  last_name: Scott
                  username: 39f4dedd-2754-4ee1-9c0c-1
              schema:
                $ref: '#/components/schemas/TeamMember'
          description: OK
        "400":
          content:
            application/json:
              example:
                detail: This request can not be processed.
            application/xml:
              example:
                detail: This request can not be processed.
          description: Bad Request
        "403":
          content:
            application/json:
              example:
                detail: You do not have permission to perform this action.
            application/xml:
              example:
                detail: You do not have permission to perform this action.
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
          description: Not Found
      summary: Invite User
      tags:
        - Account Member
