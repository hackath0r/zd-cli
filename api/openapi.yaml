components:
  headers:
    ExpiresAfter:
      description: date in UTC when token expires
      schema:
        format: date-time
        type: string
  schemas:
    AccountCustomRole:
      description: Account Custom Role object's schema
      properties:
        description:
          description: A string that represents the description for Account Custom Role object
          type: string
        name:
          description: A string that represents the unique name for Account Custom Role object
          type: string
        permissions:
          description: An array of account level permissions
          type: string
        unique_id:
          description: A system generated string that represents the Account Custom Role object's unique_id
          type: string
      type: object
    AccountCustomRolePayload:
      description: Payload schema for the Account Custom Role object
      properties:
        description:
          description: A string that represents the description for Account Custom Role object
          type: string
        name:
          description: A string that represents the unique name for Account Custom Role object
          type: string
        permissions:
          description: An array of account level permissions
          items:
            type: string
          type: array
      required:
        - permissions
      type: object
    AccountCustomRolePostAndPutResponse:
      description: Account Custom Role object's put and post response schema
      properties:
        description:
          description: A string that represents the description for Account Custom Role object
          type: string
        name:
          description: A string that represents the unique name for Account Custom Role object
          type: string
        unique_id:
          description: A system generated string that represents the Account Custom Role object's unique_id
          type: string
      type: object
    AccountMember:
      description: Account Member object schema
      properties:
        is_verified:
          default: false
          description: A boolean flag that represents the Account Member object's verification
          type: boolean
        joining_date:
          description: A formatted string that represents the Account Member object's joining_date
          type: string
        role:
          default: 3
          description: An integer that represents the Account Member object's role. 1 is owner, 2 is admin and 3 is user
          type: integer
        time_zone:
          default: UTC
          description: A formatted string that represents the Account Member object's time zone. You can check out the time zone list here https://timezonedb.com/time-zones
          type: string
        unique_id:
          description: A system-generated string that represents the Account Member object's unique_id
          type: string
        user:
          $ref: '#/components/schemas/User'
      type: object
    AccountMemberPayload:
      description: Payload schema for the Account Member object
      properties:
        role:
          default: 3
          description: An integer that represents the Account Member object's role. 1 is owner, 2 is admin and 3 is user
          type: integer
        time_zone:
          default: UTC
          description: A formatted string that represents the Account Member object's time zone. You can check out the time zone list here https://timezonedb.com/time-zones
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
        - user
      type: object
    AlertStatus:
      description: Alert Status object schema
      properties:
        alert:
          description: unique_id of an alert object
          type: string
        error:
          description: short error message if any error in alert creation
          type: string
        incident:
          $ref: '#/components/schemas/AlertStatusIncident'
        integration:
          $ref: '#/components/schemas/AlertStatusIntegration'
        is_incident_created:
          description: A boolean flag that represents whether the Incident Alert object created an incident or not.
          type: boolean
        status:
          description: Status of an Alert. Possible statuses are queued, completed and failed
          type: string
        suppressed:
          description: A boolean flag that represents whether the Event object is suppressed or not
          type: boolean
      type: object
    AlertStatusIncident:
      description: Incident schema for Alert Status object
      properties:
        incident_number:
          description: A integer that represents the number of an Incident object
          type: integer
        unique_id:
          description: A string that represents the unique_id of an Incident object
          type: string
      type: object
    AlertStatusIntegration:
      description: Integration schema for Alert Status object
      properties:
        name:
          description: A string that represents the name of an Integration object
          type: string
      type: object
    AlertTransformer:
      description: Alert Transformer Action object schema
      properties:
        actions:
          description: An array of Alert Transformer Action objects
          items:
            $ref: '#/components/schemas/AlertTransformerAction'
          type: array
        description:
          description: A string that represents the Alert Transformer object's description
          type: string
        rule_json:
          description: A string that represents the all the conditions of the alert rule
          type: string
        unique_id:
          description: A system-generated string that represents the Alert Transformer unique_id
          type: string
      type: object
    AlertTransformerAction:
      description: Alert Transformer Action object schema
      properties:
        action_type:
          description: An integer that represents the Alert Transformer Action object's action_type in an Alert Rule
          type: integer
        assign_to:
          description: A system-generated string that represents the User object's username
          type: string
        assign_to_name:
          description: A string that represents the name of the assignee
          type: string
        escalation_policy:
          description: A system-generated string that represents the Escalation Policy object's unique_id
          type: string
        escalation_policy_name:
          description: A string that represents the Escalation Policy object's name
          type: string
        key:
          description: A string that represents the Alert Transformer Action object's key
          type: string
        schedule:
          description: A system-generated string that represents the Schedule object's unique_id
          type: string
        sla:
          description: A system-generated string that represents the Team SLA object's unique_id
          type: string
        task_template:
          description: A system-generated string that represents the Task Template object's unique_id
          type: string
        team_priority:
          description: A system-generated string that represents the Team Priority object's unique_id
          type: string
        unique_id:
          description: A system-generated string that represents the Alert Transformer Action object's unique_id
          type: string
        value:
          description: A system-generated string that represents the User object username or Schedule object unique_id
          type: string
        value_reference_name:
          description: A string that represents the name of the responder(user or schedule)
          type: string
      type: object
    AlertTransformerActionPayload:
      description: Alert Transformer Action payload object schema
      properties:
        action_type:
          description: An integer that represents the Alert Transformer Action object's action_type in an Alert Rule
          type: integer
        assign_to:
          description: A system-generated string that represents the User object's username
          type: string
        assign_to_name:
          description: A string that represents the name of the assignee
          type: string
        escalation_policy:
          description: A system-generated string that represents the Escalation Policy object's unique_id
          type: string
        escalation_policy_name:
          description: A string that represents the Escalation Policy object's name
          type: string
        key:
          description: A string that represents the Alert Transformer Action object's key
          type: string
        schedule:
          description: A system-generated string that represents the Schedule object's unique_id
          type: string
        sla:
          description: A system-generated string that represents the Team SLA object's unique_id
          type: string
        task_template:
          description: A system-generated string that represents the Task Template object's unique_id
          type: string
        team_priority:
          description: A system-generated string that represents the Team Priority object's unique_id
          type: string
        value:
          description: A system-generated string that represents the User object username or Schedule object unique_id
          type: string
        value_reference_name:
          description: A string that represents the name of the responder(user or schedule)
          type: string
      type: object
    AlertTransformerPayload:
      description: Alert Transformer Action object payload schema
      properties:
        actions:
          description: An array of Alert Transformer Action objects
          items:
            $ref: '#/components/schemas/AlertTransformerActionPayload'
          type: array
        description:
          description: A string that represents the Alert Transformer object's description
          type: string
        rule_json:
          description: A string that represents the all the conditions of the alert rule
          type: string
      type: object
    AnalyticsMetrics:
      description: Common analytics metrics.
      properties:
        mtta_seconds:
          description: Weighted average Mean Time to Acknowledge in seconds.
          format: float
          type: number
        mttr_seconds:
          description: Weighted average Mean Time to Resolve in seconds.
          format: float
          type: number
        total_acknowledged:
          description: Incidents with status > 1 (acknowledged or resolved).
          type: integer
        total_incidents:
          description: Total incidents.
          type: integer
        total_resolved:
          description: Incidents with status = 3.
          type: integer
      type: object
    AnalyticsRequestBody:
      description: Common request body for all analytics endpoints. All fields are optional.
      properties:
        child_incident:
          description: Set to "exclude" to exclude merged child incidents. Any other value has no effect.
          example: include
          type: string
        escalation_policy_ids:
          description: List of escalation policy unique_id UUIDs.
          items:
            format: uuid
            type: string
          type: array
        from_date:
          description: Start date in YYYY-MM-DD format
          example: "2025-09-24"
          format: date
          type: string
        priority_ids:
          description: List of team priority unique_id UUIDs.
          items:
            format: uuid
            type: string
          type: array
        service_ids:
          description: List of service unique_id UUIDs.
          items:
            format: uuid
            type: string
          type: array
        sla_ids:
          description: List of SLA unique_id UUIDs.
          items:
            format: uuid
            type: string
          type: array
        tag_ids:
          description: List of team tag unique_id UUIDs.
          items:
            format: uuid
            type: string
          type: array
        team_ids:
          description: List of team unique_id UUIDs. Empty array means all accessible teams.
          items:
            format: uuid
            type: string
          type: array
        to_date:
          description: End date in YYYY-MM-DD format
          example: "2025-12-23"
          format: date
          type: string
        tta:
          description: Time-to-acknowledge threshold in seconds. Requires tta_comparator.
          type: number
        tta_comparator:
          description: Required if tta is set.
          enum:
            - gt
            - lt
          type: string
        ttr:
          description: Time-to-resolve threshold in seconds. Requires ttr_comparator. Must be >= tta if both are set.
          type: number
        ttr_comparator:
          description: Required if ttr is set.
          enum:
            - gt
            - lt
          type: string
        urgency:
          description: 0 for low, 1 for high.
          example: "1"
        user_ids:
          description: List of usernames. Use "Unassigned" to filter unassigned incidents.
          items:
            type: string
          type: array
      type: object
    AnalyticsServiceInfo:
      properties:
        name:
          description: Service name.
          type: string
        unique_id:
          description: Service unique identifier.
          format: uuid
          type: string
      type: object
    AnalyticsTeamInfo:
      properties:
        name:
          description: Team name.
          type: string
        unique_id:
          description: Team unique identifier.
          format: uuid
          type: string
      type: object
    AnalyticsUserInfo:
      properties:
        full_name:
          description: User's full name (first + last name).
          type: string
        username:
          description: Username.
          type: string
      type: object
    Application:
      description: Application object schema
      properties:
        application_type:
          description: An integer that represents Application object's application_type 0 for alert and 1 for outbound
          type: integer
        availability_plan_id:
          description: An integer that represents Application object's availability_plan_id
          type: integer
        categories:
          description: A string that represents Application object's categories
          type: string
        description:
          description: A string that represents Application object's description
          type: string
        documentation_link:
          description: A string that represents Application object's documentation_link
          type: string
        extension:
          description: A string that represents Application object's extension
          type: string
        icon_url:
          description: A string that represents Application object's icon_url
          type: string
        name:
          description: A string that represents Application object's name
          type: string
        setup_instructions:
          description: A string that represents Application object's setup_instructions
          type: string
        summary:
          description: A string that represents Application object's summary
          type: string
        unique_id:
          description: A system-generated string that represents Application object's unique_id
          type: string
      type: object
    DeleteUserPayload:
      description: Payload schema for the Delete User object
      properties:
        username:
          description: A system-generated string that represents the User object's username
          type: string
      required:
        - username
      type: object
    EP:
      description: Escalation Policy object schema
      properties:
        description:
          description: A string that represents the Escalation Policy object's description
          type: string
        global_ep:
          description: A boolean flag that represents whether the Escalation Policy is global or not.
          type: boolean
        move_to_next:
          description: A boolean flag that represents whether to move to the next Escalation Rule if no user is found on the current Escalation Rule
          type: boolean
        name:
          description: A string that represents the Escalation Policy object's name
          type: string
        repeat_policy:
          description: An integer that represents the Escalation Policy object's repeat_policy
          type: integer
        rules:
          $ref: '#/components/schemas/EP_Rule'
        summary:
          description: A string that represents the Escalation Policy object's summary
          type: string
        team:
          description: A system-generated string that represents the Team object's unique_id
          type: string
        unique_id:
          description: A string that represents the Escalation Policy object's unique_id
          type: string
      type: object
    EP_Rule:
      description: Escalation Policy Rule object schema
      properties:
        delay:
          default: 0
          description: An integer that represents the amount of time before the escalation of the Escalation Policy object after the incident object is created. For example, t=0 is When an incident is created, if delay=5, then this Escalation Policy Rule object will be escalated at t=5.
          type: integer
        position:
          description: An integer that represents the Escalation Policy Rule object's position
          type: integer
        target:
          description: Escalation Policy Rule Target object schema
          properties:
            target_id:
              description: A system-generated string that represents Escalation Policy Rule Target object's target_id. If target_type is 1 then target_id is Schedule object's unique_id and if target_type is 2 then target_id is User object's username
              type: string
            target_type:
              description: An integer that represents the Escalation Policy Rule Target object's target_type. 1 for Schedule and 2 for User
              type: integer
          type: object
        unique_id:
          description: A system-generated string that represents Escalation Policy Rule object's unique_id.
          type: string
      required:
        - delay
      type: object
    EP_RulePayload:
      description: Escalation Policy Rule Payload object schema
      properties:
        delay:
          default: 0
          description: An integer that represents the amount of time before the escalation of the Escalation Policy object after the incident object is created. For example, t=0 is When an incident is created, if delay=5, then this Escalation Policy Rule object will be escalated at t=5.
          type: integer
        position:
          description: An integer that represents the Escalation Policy Rule object's position
          type: integer
        target:
          description: Escalation Policy Rule Target object schema
          properties:
            target_id:
              description: A system-generated string that represents Escalation Policy Rule Target object's target_id. If target_type is 1 then target_id is Schedule object's unique_id and if target_type is 2 then target_id is User object's username
              type: string
            target_type:
              description: An integer that represents the Escalation Policy Rule Target object's target_type. 1 for Schedule and 2 for User
              type: integer
          type: object
      required:
        - delay
      type: object
    EPPayload:
      description: Payload schema for the Escalation Policy object
      properties:
        description:
          description: A string that represents the Escalation Policy object's description
          type: string
        name:
          description: A string that represents the Escalation Policy object's name
          type: string
        rules:
          $ref: '#/components/schemas/EP_RulePayload'
        summary:
          description: A string that represents the Escalation Policy object's summary
          type: string
      required:
        - name
        - rules
      type: object
    EscalationPolicyOnCallV1:
      description: Team OnCall object schema v1
      properties:
        escalation_policy:
          description: Escalation Policy object schema for OnCall object schema.
          properties:
            description:
              description: A string that represents the Escalation Policy object's description
              type: string
            move_to_next:
              description: A boolean flag that represents whether to move to the next Escalation Policy Rule if no User is found within the Escalation Policy Rule
              type: boolean
            name:
              description: A string that represents the Escalation Policy object's name
              type: string
            repeat_policy:
              description: An integer that represents the Escalation Policy object's repeat_policy
              type: integer
            summary:
              description: A string that represents the Escalation Policy object's summary
              type: string
            unique_id:
              description: A system-generated string that represents the Escalation Policy object's unique_id
              type: string
          type: object
        team:
          description: Team object schema for OnCall object schema
          properties:
            name:
              description: A string that represents the Team object's name
              type: string
            unique_id:
              description: A system-generated string that represents the Team object's unique_id
              type: string
          type: object
        user:
          $ref: '#/components/schemas/User'
      type: object
    EscalationPolicyOnCallV2:
      description: Team OnCall object schema v2
      properties:
        name:
          description: A string that represents the Escalation Policy object's name
          type: string
        oncalls:
          description: An array of Escalation Policy Rule OnCall objects
          items:
            $ref: '#/components/schemas/EscalationPolicyRuleOnCall'
          type: array
        unique_id:
          description: A system-generated string that represents the Escalation Policy object's unique_id
          type: string
      type: object
    EscalationPolicyRuleOnCall:
      description: Escalation Policy OnCall object schema
      properties:
        delay:
          description: An integer that represents the Escalation Policy Rule object's delay in an Escalation Policy
          type: integer
        ep_rule:
          description: A system-generated string that represents the Escalation Policy object's unique_id
          type: string
        oncalls:
          description: An array of User objects who is on call in an Escalation Policy Rule
          items:
            $ref: '#/components/schemas/User'
          type: array
        position:
          description: An integer that represents the Escalation Policy Rule object's position in an Escalation Policy
          type: integer
      type: object
    Event:
      description: Event object schema
      properties:
        alert_type:
          default: 1
          description: An integer that represents the Event object's alert_type. 0 is for info, 1 is for warning, 2 for error, 3 is  for critical, 4 is for acknowledged and 5 is for resolved.
          type: integer
        creation_date:
          description: A formatted string that represents the Event object's creation_date
          format: date-time
          type: string
        entity_id:
          description: A system-generated string that represents the Event object's entitiy_id
          type: string
        images:
          items:
            $ref: '#/components/schemas/EventImage'
          type: array
        incident:
          description: An integer that represents the Incident object's incident_number
          type: integer
        incident_created:
          description: A boolean flag that represents whether the Incident Alert object created an incident or not.
          type: boolean
        integration:
          description: A string that represents the Integration object's unique_id
          type: string
        integration_object:
          description: Integration object schema for Event object schema
          properties:
            creation_date:
              description: A formatted string that represents the Integration object's creation_date
              format: date-time
              type: string
            integration_key:
              description: A system-generated string that represents the Integration object's integration_key
              type: string
            integration_type:
              default: 0
              description: An integer that represents the Integration object's integration_type. 0 is alert and 1 is outbound.
              type: integer
            is_enabled:
              default: true
              description: A boolean flag that represents whether an Integration is enabled or not
              type: boolean
            name:
              description: A string that represents the Integration object's name
              type: string
            service:
              description: A system-generated string that represents the Service object's unique_id
              type: string
            summary:
              description: A string that represents the Integration object's summary
              type: string
            team:
              description: A system-generated string that represents the Team object's unique_id
              type: string
            unique_id:
              description: A system-generated string that represents the Integration object's unique_id
              type: string
          type: object
        message:
          description: A string that represents the Event object's message
          type: string
        notes:
          items:
            $ref: '#/components/schemas/EventNote'
          type: array
        payload:
          description: Additional payload of the Event object
          type: object
        summary:
          description: A string that represents the Event object's summary
          type: string
        suppressed:
          default: true
          description: A boolean flag that represents whether the Event object is suppressed or not
          type: boolean
        unique_id:
          description: A system-generated string that represents the Event object's unique_id
          type: string
        urls:
          items:
            $ref: '#/components/schemas/EventUrl'
          type: array
      type: object
    EventImage:
      description: Event Image object schema
      properties:
        image_src:
          description: A string that represents the Event Image object's image_src
          type: string
        image_text:
          description: A string that represents the Event Image object's image_text
          type: string
        image_url:
          description: A string that represents the Event Image object's image_url
          type: string
      type: object
    EventNote:
      description: Event Note object schema
      properties:
        note_text:
          description: A string that represents the Event Note object's note_text
          type: string
        note_title:
          description: A string that represents the Event Note object's note_title
          type: string
      type: object
    EventPayload:
      description: Payload schema for the Event object
      properties:
        alert_type:
          default: info
          description: A pre-defined string that represents the Event object's alert_type. Choices - `critical`, `acknowledged`, `resolved`, `error`, `warning`, `info`.
          type: string
        entity_id:
          description: A unique id for the alert. If not provided, the Zenduty API will create one.
          type: string
        message:
          description: A string that represents the Event object's message
          type: string
        payload:
          description: A JSON payload containing additional information about the alert.
          type: object
        summary:
          description: A string that represents the Event object's summary
          type: string
        urls:
          description: An array containing JSON schema of urls related to alerts.
          items:
            type: string
          type: array
      required:
        - message
        - alert_type
      type: object
    EventUrl:
      description: Event URL object schema
      properties:
        link_text:
          description: A string that represents the Event URL object's link_text
          type: string
        link_url:
          description: A string that represents the Event URL object's link_url
          type: string
      type: object
    EventV3:
      description: Event object schema
      properties:
        message:
          description: success if alert processed successfully
          type: string
        trace_id:
          description: unique id to trace an alert
          type: string
      type: object
    GenericEventPayload:
      description: Payload schema for the Generic Event object
      properties:
        alert_type:
          default: info
          description: A pre-defined string that represents the Event object's alert_type. Choices - `critical`, `acknowledged`, `resolved`, `error`, `warning`, `info`.
          type: string
        entity_id:
          description: A unique id for the alert. If not provided, the Zenduty API will create one.
          type: string
        escalation_policy:
          description: A unique id for the alert. If not provided or provided invalid unique_id, the Zenduty will ignore the provided value.
          type: string
        message:
          description: A string that represents the Event object's message
          type: string
        payload:
          description: A JSON payload containing additional information about the alert.
          type: object
        priority:
          description: A unique id for the alert. If not provided or provided invalid unique_id, the Zenduty will ignore the provided value.
          type: string
        sla:
          description: A unique id for the SLA object. If not provided or provided invalid unique_id, the Zenduty will ignore the provided value.
          type: string
        stakeholders:
          $ref: '#/components/schemas/Stakeholder'
        stakeholders_comms:
          $ref: '#/components/schemas/StakeholderMessage'
        summary:
          description: A string that represents the Event object's summary
          type: string
        tags:
          description: An array containing unique_id for the tag objects.
          items:
            type: string
          type: array
        urls:
          description: An array containing JSON schema of urls related to alerts.
          items:
            type: string
          type: array
      required:
        - message
        - alert_type
      type: object
    GlobalRouter:
      description: Global Router object schema
      properties:
        account:
          description: A system-generated string that represents the Account object's unique_id
          type: string
        description:
          description: A string that represents the Global Router object's description
          type: string
        integration_key:
          description: A system-generated string that represents the Integration object's integration_key
          type: string
        is_enabled:
          description: A boolean tag that represents weather the Global Router object's is enabled or not
          type: boolean
        name:
          description: A string that represents the Global Router object's name
          type: string
        unique_id:
          description: A system-generated string that represents the Global Router object's unique_id
          type: string
      type: object
    GlobalRouterPayload:
      description: Payload schema for the Global Router object
      properties:
        description:
          description: A string that represents the Global Router object's description
          type: string
        name:
          description: A string that represents the Global Router object's name
          type: string
      type: object
    GlobalRouterRule:
      description: Global Router Rule object schema
      properties:
        actions:
          description: An array of Global Router Rule Action objects
          items:
            $ref: '#/components/schemas/GlobalRouterRuleAction'
          type: array
        name:
          description: A string that represents the Global Router Rule object's name
          type: string
        position:
          description: An integer that represents the Global Router Rule object's position
          type: integer
        router:
          description: A system-generated string that represents the Global Router object's unique_id
          type: string
        rule_json:
          description: A string that represents the rule json of Global Router Rule object
          type: string
        unique_id:
          description: A system-generated string that represents the Global Router Rule object's unique_id
          type: string
      type: object
    GlobalRouterRuleAction:
      description: Global Router Rule Action object schema
      properties:
        action_type:
