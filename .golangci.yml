version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - gosec
    - revive
    - misspell
    - unconvert
  settings:
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: var-naming
        - name: package-comments
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
      - path: \.gen\.go
        linters: [gosec, errcheck, govet, staticcheck, unused, gocritic, revive, misspell, unconvert]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hackath0r/zd-cli

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
