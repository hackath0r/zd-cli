version: 2

project_name: zd-cli

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: zd
    main: ./cmd/zd
    binary: zd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/hackath0r/zd-cli/internal/version.Version={{.Version}}
      - -X github.com/hackath0r/zd-cli/internal/version.Commit={{.ShortCommit}}
      - -X github.com/hackath0r/zd-cli/internal/version.Date={{.CommitDate}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName | replace "-cli" "" }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: 'Features'
      regexp: "^.*feat[(\\w]*.*?:.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w]*.*?:.*$"
      order: 1
    - title: 'Other changes'
      order: 999

nfpms:
  - id: packages
    package_name: zd-cli
    file_name_template: '{{ .ProjectName | replace "-cli" "" }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    vendor: hackath0r
    homepage: https://github.com/hackath0r/zd-cli
    maintainer: hackath0r <hackath0r@users.noreply.github.com>
    description: Cross-platform CLI for the Zenduty / Xurrent IMR REST API.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: /usr/bin/zd
        dst: /usr/bin/ximr
        type: symlink
      - src: LICENSE
        dst: /usr/share/doc/zd-cli/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/zd-cli/NOTICE

brews:
  - name: zd-cli
    repository:
      owner: hackath0r
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    homepage: https://github.com/hackath0r/zd-cli
    description: Cross-platform CLI for the Zenduty / Xurrent IMR REST API
    license: Apache-2.0
    install: |
      bin.install "zd"
      bin.install_symlink "zd" => "ximr"
    test: |
      assert_match "zd", shell_output("#{bin}/zd version")
    commit_msg_template: 'feat: bump zd-cli to {{ .Tag }}'

scoops:
  - name: zd-cli
    repository:
      owner: hackath0r
      name: scoop-bucket
      token: '{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}'
    homepage: https://github.com/hackath0r/zd-cli
    description: Cross-platform CLI for the Zenduty / Xurrent IMR REST API
    license: Apache-2.0
    commit_msg_template: 'feat: bump zd-cli to {{ .Tag }}'
    post_install:
      - 'Copy-Item -Path "$dir\zd.exe" -Destination "$dir\ximr.exe" -Force'

release:
  github:
    owner: hackath0r
    name: zd-cli
  draft: false
  prerelease: auto
  name_template: 'zd-cli {{ .Tag }}'
  header: |
    ## zd-cli {{ .Tag }}

    Install:

    ```sh
    # macOS / Linux
    curl -fsSL https://raw.githubusercontent.com/hackath0r/zd-cli/main/scripts/install.sh | sh

    # Homebrew
    brew install hackath0r/tap/zd-cli

    # Scoop (Windows)
    scoop bucket add hackath0r https://github.com/hackath0r/scoop-bucket
    scoop install zd-cli

    # Go
    go install github.com/hackath0r/zd-cli/cmd/zd@{{ .Tag }}
    ```

    The same binary is also installed as `ximr` on every channel.
  footer: |
    ---
    **Full Changelog**: https://github.com/hackath0r/zd-cli/compare/{{ .PreviousTag }}...{{ .Tag }}
